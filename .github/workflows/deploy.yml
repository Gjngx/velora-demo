
name: Deploy WordPress Velora

on:
  push:
    branches:
      - main
    paths:
      - 'wp-content/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy wp-content to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./wp-content/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Keep this file on the FTP server so later runs upload only changed files.
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/uploads/**
            **/cache/**
            **/upgrade/**
            **/upgrade-temp-backup/**
            **/backups/**
            **/ai1wm-backups/**
            **/.DS_Store
